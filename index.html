<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compte à rebours · 3 minutes</title>
    <meta name="description" content="Compte à rebours premium de 180 secondes avec lancement 3-2-1, alertes sonores et animation de fin.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Inter:wght@200;300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --sun: #ff7a2f;
            --gold: #ffc65c;
            --amber: #ff9f43;
            --rose: #ff4d6d;
            --dusk: #2a1838;
            --ink: #fff7ee;
            --muted: rgba(255, 240, 225, .72);
            --glass: rgba(28, 14, 34, .38);
            --stroke: rgba(255, 230, 200, .22);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            font-family: 'Outfit', system-ui, sans-serif;
            color: var(--ink);
            background: #1a0d14;
            overflow: hidden;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* ---------- Fond ---------- */
        .bg {
            position: fixed; inset: 0;
            background: url("francois (1).png") center 60% / cover no-repeat;
            z-index: 0;
        }
        @keyframes kenburns {
            from { transform: scale(1) translate(0, 0); }
            to   { transform: scale(1.08) translate(-1.5%, -1%); }
        }
        .shade {
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
            background:
                radial-gradient(ellipse 60% 70% at 50% 48%, rgba(20, 8, 20, .45) 0%, rgba(20, 8, 20, .1) 70%),
                linear-gradient(180deg, rgba(25, 12, 40, .35) 0%, rgba(0, 0, 0, 0) 40%, rgba(40, 12, 0, .45) 100%);
            transition: background .6s ease;
        }
        .vignette {
            position: fixed; inset: 0; z-index: 2; pointer-events: none;
            box-shadow: inset 0 0 220px 40px rgba(255, 30, 60, .0);
        }
        .vignette.flash { animation: vflash .9s ease-out; }
        @keyframes vflash {
            0%   { box-shadow: inset 0 0 260px 80px rgba(255, 40, 70, .75); }
            100% { box-shadow: inset 0 0 220px 40px rgba(255, 40, 70, 0); }
        }

        /* Poussière de sable */
        .dust { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
        .dust span {
            position: absolute; bottom: -10px; border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 220, 160, .9), rgba(255, 180, 90, 0) 70%);
            animation: rise linear infinite;
        }
        @keyframes rise {
            0%   { transform: translate(0, 0); opacity: 0; }
            10%  { opacity: .9; }
            100% { transform: translate(var(--dx), -110vh); opacity: 0; }
        }

        /* ---------- Layout ---------- */
        body { display: flex; flex-direction: column; }
        .event-logo { position: absolute; top: 24px; left: 24px; z-index: 5; width: clamp(170px, 24vw, 360px); height: auto; filter: drop-shadow(0 0 8px rgba(255,255,255,.95)) drop-shadow(0 2px 20px rgba(0,0,0,.6)); pointer-events: none; transition: all .3s ease; }
        #fullscreenBtn { position: absolute; top: 10px; right: 12px; z-index: 5; width: 34px; height: 34px; border-radius: 10px; opacity: .75; }
        #fullscreenBtn svg { width: 16px; height: 16px; }
        #fullscreenBtn:hover { opacity: 1; }
        body.is-fs #fullscreenBtn, :fullscreen #fullscreenBtn { display: none; }
        .logo { display: block; width: 100%; height: auto; position: relative; z-index: 30; flex: 0 0 auto; box-sizing: border-box; padding: 8px clamp(10px, 2vw, 28px); background: rgba(255, 255, 255, .94); }
        .logo-top { box-shadow: 0 6px 24px rgba(0,0,0,.25); border-bottom: 3px solid rgba(255, 150, 60, .8); }
        .logo-bottom { box-shadow: 0 -6px 24px rgba(0,0,0,.25); border-top: 3px solid rgba(255, 150, 60, .8); }
        .stage {
            position: relative; z-index: 3;
            flex: 1 1 auto; min-height: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 12px 16px;
            gap: 14px;
        }
        body.done .time { font-size: clamp(3rem, min(15vw, 13vh), 8rem); letter-spacing: 2px; color: #ffd0d8; text-shadow: 0 0 30px rgba(255, 60, 90, .95); animation: rise-in .8s cubic-bezier(.2, 1.3, .3, 1) both; }
        body.done .label { display: none; }
        #restartBtn { display: none; }
        body.done #restartBtn { display: inline-flex; }
        body.done #startBtn { display: none; }

        .card {
            width: auto;
            display: flex; flex-direction: column; align-items: center;
            animation: cardIn .9s cubic-bezier(.2, .9, .25, 1.1) both;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px) scale(.96); }
            to   { opacity: 1; transform: none; }
        }

        header.top {
            width: 100%;
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
        }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-icon {
            width: 44px; height: 44px; border-radius: 14px;
            display: grid; place-items: center;
            background: linear-gradient(135deg, var(--sun), var(--gold));
            box-shadow: 0 8px 24px -6px rgba(255, 122, 47, .8);
        }
        .brand-icon svg { width: 22px; height: 22px; color: #2a1220; }
        h1 { font-size: 1.15rem; font-weight: 600; letter-spacing: .2px; }
        .brand p { font-size: .78rem; color: var(--muted); margin-top: 2px; letter-spacing: .3px; }

        .chip {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 7px 14px; border-radius: 999px;
            font-size: .75rem; font-weight: 600; letter-spacing: .4px;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .14);
            white-space: nowrap;
            transition: all .4s ease;
        }
        .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px var(--gold); }
        body.running .chip .dot { background: #5ef0a0; box-shadow: 0 0 10px #5ef0a0; animation: blink 1.2s infinite; }
        body.danger  .chip { background: rgba(255, 77, 109, .18); border-color: rgba(255, 77, 109, .5); }
        body.danger  .chip .dot { background: var(--rose); box-shadow: 0 0 12px var(--rose); animation: blink .5s infinite; }
        body.done    .chip .dot { background: var(--gold); animation: blink .8s infinite; }
        @keyframes blink { 50% { opacity: .25; } }

        /* ---------- Anneau ---------- */
        .dial {
            position: relative;
            width: min(86vw, 46vh, 520px);
            aspect-ratio: 1;
            margin: 0 0 clamp(18px, 3vh, 30px);
            filter: drop-shadow(0 10px 30px rgba(0, 0, 0, .35));
        }
        .dial svg { width: 100%; height: 100%; overflow: visible; }
        .ticks line { stroke: rgba(255, 235, 210, .28); stroke-width: 2; stroke-linecap: round; }
        .ticks line.major { stroke: rgba(255, 235, 210, .6); stroke-width: 3; }
        .track { stroke: rgba(255, 255, 255, .10); }
        .progress {
            stroke: url(#gradSun);
            filter: drop-shadow(0 0 10px rgba(255, 150, 60, .75));
            transition: stroke .4s;
        }
        .knob { fill: #fff; filter: drop-shadow(0 0 8px rgba(255, 200, 120, 1)); }
        body.danger .progress { stroke: url(#gradDanger); filter: drop-shadow(0 0 14px rgba(255, 60, 90, .95)); }
        body.danger .knob { filter: drop-shadow(0 0 10px rgba(255, 60, 90, 1)); }

        .center {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center;
        }
        .time {
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            font-size: clamp(5rem, min(30vw, 22vh), 12rem);
            letter-spacing: -4px;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            text-shadow: 0 4px 18px rgba(0, 0, 0, .45), 0 0 40px rgba(255, 150, 60, .6);
            transition: color .3s, text-shadow .3s;
        }
        .time .colon { opacity: .7; margin: 0 2px; }
        body.running:not(.danger) .time .colon { animation: blink 1s steps(1) infinite; }
        body.danger .time { color: #ffd0d8; text-shadow: 0 0 30px rgba(255, 60, 90, .95), 0 0 60px rgba(255, 60, 90, .6); }
        .time.beat { animation: beat .5s cubic-bezier(.2, 1.6, .4, 1); }
        @keyframes beat { 0% { transform: scale(1.22); } 100% { transform: scale(1); } }

        .label {
            margin-top: 12px;
            font-size: .72rem; font-weight: 600;
            letter-spacing: 6px; text-transform: uppercase;
            color: var(--muted);
            text-shadow: 0 2px 8px rgba(0, 0, 0, .6);
        }
        body.danger .label { color: #ff9bb0; }

        /* ---------- Bouton ---------- */
        .btn {
            position: relative; overflow: hidden;
            display: inline-flex; align-items: center; justify-content: center; gap: 12px;
            min-width: 240px;
            padding: 18px 40px;
            border: 0; border-radius: 999px; cursor: pointer;
            font-family: inherit; font-size: 1.1rem; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase;
            color: #2a1220;
            background: linear-gradient(135deg, var(--gold) 0%, var(--amber) 45%, var(--sun) 100%);
            box-shadow: 0 14px 40px -10px rgba(255, 122, 47, .9), inset 0 1px 0 rgba(255, 255, 255, .6);
            transition: transform .2s ease, box-shadow .3s ease, opacity .4s ease;
        }
        .btn svg { width: 22px; height: 22px; }
        .btn::after {
            content: ""; position: absolute; top: 0; left: -60%;
            width: 40%; height: 100%;
            background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .65), transparent);
            transform: skewX(-20deg);
            animation: shine 3.2s ease-in-out infinite;
        }
        @keyframes shine { 0%, 60% { left: -60%; } 100% { left: 130%; } }
        .btn:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 20px 50px -10px rgba(255, 122, 47, 1), inset 0 1px 0 rgba(255, 255, 255, .6); }
        .btn:active { transform: scale(.96); }
        .btn:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
        .btn.ghost {
            background: rgba(20, 8, 20, .6);
            color: var(--ink);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, .5);
            border: 1px solid rgba(255, 255, 255, .25);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            font-size: .95rem;
            padding: 14px 32px;
            min-width: 200px;
        }
        .btn.ghost:hover {
            background: rgba(255, 77, 109, .25);
            border-color: rgba(255, 77, 109, .6);
            box-shadow: 0 14px 40px -10px rgba(255, 77, 109, .5);
            color: #fff;
        }
        .btn.ghost::after { display: none; }

        .action-slot { height: 64px; display: flex; align-items: center; justify-content: center; gap: 12px; }
        .action-slot .btn.hide { opacity: 0; transform: scale(.8); pointer-events: none; }
        #skipBtn { display: none; }
        body.running #skipBtn { display: inline-flex; }
        body.running #startBtn, body.intro #startBtn { display: none; }

        /* Bouton plein écran */
        .icon-btn {
            position: fixed; top: 18px; right: 18px; z-index: 20;
            width: 46px; height: 46px; border-radius: 14px; cursor: pointer;
            display: grid; place-items: center;
            color: var(--ink);
            background: rgba(30, 12, 30, .35);
            border: 1px solid var(--stroke);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            transition: transform .2s, background .2s;
        }
        .icon-btn:hover { transform: scale(1.08); background: rgba(255, 150, 60, .3); }
        .icon-btn svg { width: 20px; height: 20px; }

        footer { font-size: .75rem; color: rgba(255, 240, 225, .6); letter-spacing: 1px; text-shadow: 0 1px 6px rgba(0, 0, 0, .6); }
        kbd { font-family: inherit; padding: 2px 7px; border-radius: 6px; background: rgba(255, 255, 255, .14); border: 1px solid rgba(255, 255, 255, .2); }

        /* ---------- Overlays ---------- */
        .overlay {
            position: fixed; inset: 0; z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(circle at 50% 50%, rgba(40, 12, 30, .45), rgba(10, 4, 14, .78));
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            opacity: 0; visibility: hidden;
            transition: opacity .45s ease, visibility .45s;
        }
        .overlay.show { opacity: 1; visibility: visible; }

        .intro-num {
            position: relative;
            font-weight: 900;
            font-size: clamp(9rem, 38vmin, 22rem);
            line-height: 1;
            background: linear-gradient(180deg, #fff3d6 0%, var(--gold) 40%, var(--sun) 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            filter: drop-shadow(0 10px 40px rgba(255, 122, 47, .8));
        }
        .intro-num.go {
            font-size: clamp(3.4rem, 13vmin, 9rem);
            letter-spacing: 4px;
        }
        .intro-num.pop { animation: pop 1s cubic-bezier(.15, .9, .3, 1) both; }
        @keyframes pop {
            0%   { opacity: 0; transform: scale(2.4); filter: blur(12px) drop-shadow(0 10px 40px rgba(255, 122, 47, .8)); }
            25%  { opacity: 1; transform: scale(1); filter: blur(0) drop-shadow(0 10px 40px rgba(255, 122, 47, .8)); }
            80%  { opacity: 1; transform: scale(.94); }
            100% { opacity: 0; transform: scale(.7); }
        }
        .shock {
            position: absolute; left: 50%; top: 50%;
            width: 40vmin; height: 40vmin; margin: -20vmin 0 0 -20vmin;
            border-radius: 50%;
            border: 3px solid rgba(255, 200, 120, .8);
            box-shadow: 0 0 40px rgba(255, 150, 60, .7), inset 0 0 40px rgba(255, 150, 60, .5);
            opacity: 0; pointer-events: none;
        }
        .shock.go { animation: shock 1s ease-out; }
        @keyframes shock {
            0%   { opacity: 1; transform: scale(.3); }
            100% { opacity: 0; transform: scale(2.6); }
        }
        .intro-sub {
            margin-top: 18px; font-size: .9rem; letter-spacing: 6px; text-transform: uppercase; color: var(--muted);
        }

        .finish-title {
            font-weight: 900; text-align: center;
            font-size: clamp(3rem, 11vmin, 7.5rem);
            line-height: 1; letter-spacing: 2px;
            background: linear-gradient(180deg, #fff3d6 0%, var(--gold) 45%, var(--sun) 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            filter: drop-shadow(0 10px 40px rgba(255, 122, 47, .8));
        }
        .finish-sub { margin: 16px 0 38px; font-size: 1.05rem; color: var(--muted); letter-spacing: 2px; text-align: center; }
        .overlay.show .finish-title { animation: rise-in .9s cubic-bezier(.2, 1.3, .3, 1) both; }
        .overlay.show .finish-sub   { animation: rise-in .9s .15s cubic-bezier(.2, 1.3, .3, 1) both; }
        .overlay.show #restartBtn   { animation: rise-in .9s .3s cubic-bezier(.2, 1.3, .3, 1) both; }
        @keyframes rise-in { from { opacity: 0; transform: translateY(40px) scale(.9); } to { opacity: 1; transform: none; } }
        .trophy { font-size: clamp(3rem, 9vmin, 5rem); margin-bottom: 10px; animation: rise-in .8s cubic-bezier(.2, 1.4, .3, 1) both, float 3s 1s ease-in-out infinite; }
        @keyframes float { 50% { transform: translateY(-10px); } }

        #confetti { position: fixed; inset: 0; z-index: 11; pointer-events: none; }

        @media (max-height: 640px) {
            footer { display: none; }
            .brand p { display: none; }
        }
        @media (prefers-reduced-motion: reduce) {
            .bg, .dust span, .btn::after { animation: none; }
        }
    </style>
</head>
<body class="idle">

    <div class="bg" aria-hidden="true"></div>
    <div class="shade" aria-hidden="true"></div>
    <div class="dust" id="dust" aria-hidden="true"></div>
    <div class="vignette" id="vignette" aria-hidden="true"></div>

    <img class="logo logo-top" src="haut.png" alt="Partenaires">


    <main class="stage">
        <img class="event-logo" src="event.png" alt="Moroccan Sahara Innovation Challenge 2026">
        <button class="icon-btn" id="fullscreenBtn" title="Plein écran" aria-label="Plein écran">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        </button>
        <section class="card" aria-live="polite">
            <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Compte à rebours 180 secondes</h1>

            <div class="dial">
                <svg viewBox="0 0 400 400">
                    <defs>
                        <linearGradient id="gradSun" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#fff0c2"/>
                            <stop offset="40%" stop-color="#ffc65c"/>
                            <stop offset="100%" stop-color="#ff6a2b"/>
                        </linearGradient>
                        <linearGradient id="gradDanger" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#ffb3c1"/>
                            <stop offset="100%" stop-color="#ff2a55"/>
                        </linearGradient>
                    </defs>
                    <g class="ticks" id="ticks"></g>
                    <g transform="rotate(-90 200 200)">
                        <circle class="track" cx="200" cy="200" r="160" fill="none" stroke-width="12"/>
                        <circle class="progress" id="progress" cx="200" cy="200" r="160" fill="none" stroke-width="12" stroke-linecap="round"/>
                        <circle class="knob" id="knob" r="9" cx="360" cy="200"/>
                    </g>
                </svg>
                <div class="center">
                    <div class="time" id="time">180</div>
                    <div class="label" id="label">Secondes</div>
                </div>
            </div>

            <div class="action-slot">
                <button class="btn" id="startBtn">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
                    Lancer
                </button>
                <button class="btn ghost" id="skipBtn">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 5.27v13.46a1 1 0 0 0 1.57.82L15 13.06V18a1 1 0 0 0 2 0V6a1 1 0 0 0-2 0v4.94L6.57 4.45A1 1 0 0 0 5 5.27z"/></svg>
                    Terminer plus tôt
                </button>
                <button class="btn" id="restartBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
                    Relancer
                </button>
            </div>
        </section>

    </main>
    <img class="logo logo-bottom" src="bas.png" alt="Organisateurs">

    <!-- Intro 3 · 2 · 1 -->
    <div class="overlay" id="intro" aria-hidden="true">
        <div class="shock" id="shock"></div>
        <div class="intro-num" id="introNum">3</div>
        <div class="intro-sub" id="introSub">Préparez-vous</div>
    </div>


    <canvas id="confetti"></canvas>

    <script>
        const TOTAL = 180;
        const R = 160;
        const CIRC = 2 * Math.PI * R;

        const $ = (id) => document.getElementById(id);
        const body = document.body;
        const timeEl = $('time'), labelEl = $('label'), statusEl = null;
        const progress = $('progress'), knob = $('knob');
        const intro = $('intro'), introNum = $('introNum'), introSub = $('introSub'), shock = $('shock');
        const vignette = $('vignette');

        let state = 'idle';           // idle | intro | running | done
        let endAt = 0, lastSec = TOTAL, rafId = null, tickTimer = null;

        progress.style.strokeDasharray = CIRC;

        /* ---------- Graduations ---------- */
        (function buildTicks() {
            const g = $('ticks');
            for (let i = 0; i < 60; i++) {
                const a = (i / 60) * Math.PI * 2 - Math.PI / 2;
                const major = i % 5 === 0;
                const r1 = 182, r2 = major ? 196 : 190;
                const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                l.setAttribute('x1', 200 + r1 * Math.cos(a)); l.setAttribute('y1', 200 + r1 * Math.sin(a));
                l.setAttribute('x2', 200 + r2 * Math.cos(a)); l.setAttribute('y2', 200 + r2 * Math.sin(a));
                if (major) l.classList.add('major');
                g.appendChild(l);
            }
        })();

        /* ---------- Poussière de sable ---------- */
        (function buildDust() {
            const d = $('dust');
            for (let i = 0; i < 38; i++) {
                const s = document.createElement('span');
                const size = 2 + Math.random() * 5;
                s.style.width = s.style.height = size + 'px';
                s.style.left = Math.random() * 100 + '%';
                s.style.setProperty('--dx', (Math.random() * 200 - 100) + 'px');
                s.style.animationDuration = (12 + Math.random() * 18) + 's';
                s.style.animationDelay = (-Math.random() * 30) + 's';
                d.appendChild(s);
            }
        })();

        /* ---------- Audio (Web Audio API) ---------- */
        let actx, master;
        function ensureAudio() {
            if (!actx) {
                actx = new (window.AudioContext || window.webkitAudioContext)();
                const comp = actx.createDynamicsCompressor();
                master = actx.createGain();
                master.gain.value = 0.9;
                master.connect(comp).connect(actx.destination);
            }
            if (actx.state === 'suspended') actx.resume();
        }
        function tone(freq, start, dur, { type = 'sine', vol = 0.3, attack = 0.006, glideTo = null } = {}) {
            const t = actx.currentTime + start;
            const o = actx.createOscillator(), g = actx.createGain();
            o.type = type;
            o.frequency.setValueAtTime(freq, t);
            if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + dur);
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(vol, t + attack);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            o.connect(g).connect(master);
            o.start(t); o.stop(t + dur + 0.05);
        }
        const sfx = {
            introBeep() {
                tone(660, 0, 0.35, { type: 'triangle', vol: 0.45 });
                tone(1320, 0, 0.18, { vol: 0.12 });
            },
            go() {
                tone(300, 0, 0.45, { type: 'sawtooth', vol: 0.06, glideTo: 1400 });
                tone(1046.5, 0.02, 0.9, { type: 'triangle', vol: 0.45 });
                tone(1568, 0.02, 0.9, { vol: 0.18 });
                tone(2093, 0.02, 0.6, { vol: 0.08 });
            },
            tick(last) {
                const f = last ? 1760 : 1320;
                tone(f, 0, 0.14, { type: 'square', vol: 0.14, attack: 0.002 });
                tone(f * 2, 0, 0.08, { vol: 0.08, attack: 0.002 });
            },
            finish() {
                // Buzzer "TIME UP" : deux coups de buzzer
                const buzz = (start, dur) => {
                    tone(155, start, dur, { type: 'sawtooth', vol: 0.32, attack: 0.01 });
                    tone(158, start, dur, { type: 'sawtooth', vol: 0.32, attack: 0.01 });
                    tone(77.5, start, dur, { type: 'square', vol: 0.22, attack: 0.01 });
                };
                buzz(0, 0.55);
                buzz(0.7, 0.55);
            }
        };

        /* ---------- Affichage ---------- */
        function fmt(sec) { return String(sec); }
        function setStatus(text) { if (statusEl) statusEl.textContent = text; }

        function render(remainingMs) {
            const frac = Math.max(0, Math.min(1, remainingMs / (TOTAL * 1000)));
            progress.style.strokeDashoffset = CIRC * (1 - frac);
            const a = frac * Math.PI * 2;
            knob.setAttribute('cx', 200 + R * Math.cos(a));
            knob.setAttribute('cy', 200 + R * Math.sin(a));
            knob.style.opacity = frac > 0.002 ? 1 : 0;

            const sec = Math.ceil(remainingMs / 1000);
            if (sec !== lastSec) {
                lastSec = sec;
                timeEl.innerHTML = fmt(sec);
                document.title = `${sec}s · Compte à rebours`;
                if (state === 'running' && sec <= 5 && sec > 0) onDangerTick(sec);
            }
        }

        function onDangerTick(sec) {
            if (!body.classList.contains('danger')) {
                body.classList.add('danger');
                setStatus('Dernières secondes');
                labelEl.textContent = 'Dernières secondes';
            }
            sfx.tick(sec === 1);
            timeEl.classList.remove('beat'); void timeEl.offsetWidth; timeEl.classList.add('beat');
            vignette.classList.remove('flash'); void vignette.offsetWidth; vignette.classList.add('flash');
        }

        function loop() {
            if (state !== 'running') return;
            const rem = Math.max(0, endAt - performance.now());
            render(rem);
            if (rem <= 0) return complete();
            rafId = requestAnimationFrame(loop);
        }

        /* ---------- Séquence de lancement 3 · 2 · 1 ---------- */
        function showIntroStep(text, isGo) {
            introNum.textContent = text;
            introNum.classList.toggle('go', !!isGo);
            introNum.classList.remove('pop'); void introNum.offsetWidth; introNum.classList.add('pop');
            shock.classList.remove('go'); void shock.offsetWidth; shock.classList.add('go');
        }

        function startIntro() {
            ensureAudio();
            state = 'intro';
            body.className = 'intro';
            setStatus('Lancement…');
            lastSec = -1; render(TOTAL * 1000);
            labelEl.textContent = 'Secondes';
            introSub.textContent = 'Préparez-vous';
            intro.classList.add('show');

            const steps = ['3', '2', '1'];
            steps.forEach((n, i) => setTimeout(() => { showIntroStep(n); sfx.introBeep(); }, 250 + i * 1000));
            setTimeout(() => { showIntroStep('LANCEMENT !', true); introSub.textContent = 'C\u2019est parti'; sfx.go(); }, 250 + 3000);
            setTimeout(() => { intro.classList.remove('show'); startRunning(); }, 250 + 3000 + 900);
        }

        function startRunning() {
            state = 'running';
            body.className = 'running';
            setStatus('En cours');
            endAt = performance.now() + TOTAL * 1000;
            lastSec = TOTAL;
            rafId = requestAnimationFrame(loop);
            // filet de sécurité si l'onglet est en arrière-plan (rAF suspendu)
            clearInterval(tickTimer);
            tickTimer = setInterval(() => {
                if (state !== 'running') return clearInterval(tickTimer);
                const rem = Math.max(0, endAt - performance.now());
                render(rem);
                if (rem <= 0) complete();
            }, 200);
        }

        function complete() {
            if (state !== 'running') return;
            state = 'done';
            cancelAnimationFrame(rafId); clearInterval(tickTimer);
            render(0);
            body.className = 'done';
            timeEl.textContent = 'TIME UP';
            sfx.finish();
            confetti();
        }

        function restart() {
            body.className = 'idle';
            startIntro();
        }

        /* ---------- Confettis ---------- */
        function confetti() {
            const cv = $('confetti'), ctx = cv.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
            const colors = ['#ffc65c', '#ff7a2f', '#ff4d6d', '#fff0c2', '#ffa94d', '#ffffff'];
            const parts = [];
            for (let i = 0; i < 220; i++) {
                const fromLeft = i % 2 === 0;
                parts.push({
                    x: fromLeft ? -10 : innerWidth + 10,
                    y: innerHeight * (0.55 + Math.random() * 0.35),
                    vx: (fromLeft ? 1 : -1) * (6 + Math.random() * 10),
                    vy: -(10 + Math.random() * 12),
                    w: 6 + Math.random() * 8, h: 4 + Math.random() * 6,
                    rot: Math.random() * Math.PI, vr: (Math.random() - .5) * .4,
                    c: colors[(Math.random() * colors.length) | 0]
                });
            }
            const start = performance.now();
            (function frame(now) {
                const t = now - start;
                ctx.clearRect(0, 0, innerWidth, innerHeight);
                parts.forEach(p => {
                    p.vy += 0.32; p.vx *= 0.985; p.vy *= 0.99;
                    p.x += p.vx; p.y += p.vy; p.rot += p.vr;
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, 1 - t / 4500);
                    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
                    ctx.fillStyle = p.c;
                    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.rot * 2)));
                    ctx.restore();
                });
                if (t < 4500) requestAnimationFrame(frame);
                else ctx.clearRect(0, 0, innerWidth, innerHeight);
            })(start);
        }

        /* ---------- Événements ---------- */
        $('startBtn').addEventListener('click', () => { if (state === 'idle') startIntro(); });
        $('skipBtn').addEventListener('click', () => { if (state === 'running') complete(); });
        $('restartBtn').addEventListener('click', () => { if (state === 'done') restart(); });
        document.addEventListener('keydown', (e) => {
            if (e.code !== 'Space' && e.code !== 'Enter') return;
            e.preventDefault();
            if (state === 'idle') startIntro();
            else if (state === 'done') restart();
        });

        $('fullscreenBtn').addEventListener('click', () => {
            document.documentElement.requestFullscreen?.();
        });
        document.addEventListener('fullscreenchange', () => {
            body.classList.toggle('is-fs', !!document.fullscreenElement);
        });

        lastSec = -1; render(TOTAL * 1000);
    </script>
</body>
</html>
